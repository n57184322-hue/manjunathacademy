<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin Panel{% endblock %} — Manjunath Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F97316;
  --orange-deep:#EA580C;
  --orange-soft:#FFF1E6;
  --peach:#FCEBE0;
  --cream:#FFF7F1;
  --ink:#101012;
  --muted:#6B7280;
  --line:rgba(16,16,18,.09);
  --white:#fff;
  --shadow-sm:0 2px 10px rgba(16,16,18,.06);
  --shadow-md:0 14px 34px rgba(120,60,20,.10);
  --r-pill:999px;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--cream);line-height:1.5;
}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;margin:0;letter-spacing:-.01em}

.panel-shell{display:flex;min-height:100vh}

.panel-sidebar{
  width:240px;flex:0 0 auto;background:var(--ink);color:#E7E3DF;
  display:flex;flex-direction:column;padding:22px 16px;
}
.panel-brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px}
.panel-crest{width:34px;height:34px;flex:0 0 auto}
.panel-brand-text{font-family:"Archivo",sans-serif;font-weight:800;font-size:14px;line-height:1.15}
.panel-brand-text span{display:block}
.panel-brand-text span:last-child{color:var(--orange)}

.panel-nav{display:flex;flex-direction:column;gap:4px}
.panel-nav a{
  padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;color:#C9C5C0;
  display:flex;align-items:center;gap:10px;transition:.15s ease;
}
.panel-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.panel-nav a.is-active{background:var(--orange);color:#fff}

.panel-sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.panel-view-site{font-size:13px;font-weight:600;color:#C9C5C0;padding:10px 14px;display:block;border-radius:10px}
.panel-view-site:hover{background:rgba(255,255,255,.06);color:#fff}

.panel-main{flex:1;min-width:0;display:flex;flex-direction:column}
.panel-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);
}
.panel-topbar h1{font-size:19px;font-weight:800}
.panel-user{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.panel-user strong{color:var(--ink)}
.panel-logout{
  background:var(--orange-soft);color:var(--orange-deep);font-weight:700;font-size:13px;
  padding:8px 16px;border-radius:var(--r-pill);
}
.panel-logout:hover{background:var(--orange);color:#fff}

.panel-content{padding:28px;flex:1}

.panel-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:24px}
.panel-card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.panel-card-head h2{font-size:18px;font-weight:800}
.panel-card-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:"Inter",sans-serif;font-weight:700;font-size:14px;
  padding:11px 20px;border-radius:var(--r-pill);border:1.5px solid transparent;
  cursor:pointer;transition:.18s ease;white-space:nowrap;
}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 8px 18px rgba(249,115,22,.28)}
.btn-primary:hover{background:var(--orange-deep)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:rgba(249,115,22,.5)}

.panel-table-wrap{overflow-x:auto}
table.panel-table{width:100%;border-collapse:collapse;font-size:13.5px}
table.panel-table th{
  text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:10px 14px;border-bottom:2px solid var(--line);white-space:nowrap;
}
table.panel-table td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.panel-table tr:last-child td{border-bottom:0}
.panel-badge{
  display:inline-flex;font-size:11px;font-weight:800;padding:3px 10px;border-radius:var(--r-pill);
  background:var(--orange-soft);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.04em;
}
.panel-empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14.5px}

.panel-form{display:flex;flex-direction:column;gap:16px;max-width:640px}
.panel-form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel-form label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:#374151}
.panel-label-text{display:inline-flex;align-items:center;gap:4px}
.req{color:#DC2626;font-weight:800}
.panel-form label:has(.panel-errors) input{border-color:#DC2626}
.panel-form input,.panel-form select{
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-size:14px;font-family:inherit;color:var(--ink);
}
.panel-form input:focus,.panel-form select:focus{outline:2px solid var(--orange);outline-offset:1px}
.panel-errors{color:#DC2626;font-size:12.5px;margin:2px 0 0;padding:0;list-style:none}
.panel-form-actions{display:flex;gap:12px;margin-top:4px}

.panel-alert{
  background:#ECFDF3;color:#15803D;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:700;
  margin-bottom:18px;
}

@media (max-width:820px){
  .panel-shell{flex-direction:column}
  .panel-sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 16px;overflow-x:auto}
  .panel-brand{border-bottom:0;margin-bottom:0;padding:0 14px 0 0;border-right:1px solid rgba(255,255,255,.08)}
  .panel-nav{flex-direction:row;margin-left:14px}
  .panel-sidebar-footer{margin-top:0;margin-left:auto;padding-top:0;border-top:0}
  .panel-content{padding:18px}
  .panel-form-row{grid-template-columns:1fr}
}
{% block extra_style %}{% endblock %}
</style>
</head>
<body>
<div class="panel-shell">
  <aside class="panel-sidebar">
    <div class="panel-brand">
      <span class="panel-crest" aria-hidden="true">
        <svg viewBox="0 0 100 100" role="img">
          <defs>
            <linearGradient id="pgold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F7DE9A"/>
              <stop offset=".5" stop-color="#D4A73C"/>
              <stop offset="1" stop-color="#9C6B14"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="url(#pgold)"/>
          <circle cx="50" cy="50" r="41" fill="#141019"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="url(#pgold)" stroke-width="1.5"/>
          <path d="M50 40 C40 28 26 26 16 32 c10 1 15 6 18 11 -7-2-12-1-16 2 8 1 13 4 17 9 6 7 11 10 15 11z" fill="url(#pgold)"/>
          <path d="M50 40 C60 28 74 26 84 32 c-10 1-15 6-18 11 7-2 12-1 16 2-8 1-13 4-17 9-6 7-11 10-15 11z" fill="url(#pgold)"/>
          <path d="M50 30 c4 0 7 3 7 7 0 3-2 5-4 6l6 3-9 2 3 24-3 4-3-4 3-24-9-2 6-3c-2-1-4-3-4-6 0-4 3-7 7-7z" fill="url(#pgold)"/>
          <path d="M28 72 c8-4 15-4 22-1 7-3 14-3 22 1-8 5-15 5-22 2-7 3-14 3-22-2z" fill="url(#pgold)"/>
        </svg>
      </span>
      <span class="panel-brand-text"><span>MANJUNATH</span><span>ADMIN</span></span>
    </div>

    <nav class="panel-nav">
      <a class="{% block nav_signups %}{% endblock %}" href="{% url 'panel_signups' %}">👥 Signups</a>
    </nav>

    <div class="panel-sidebar-footer">
      <a class="panel-view-site" href="{% url 'index' %}">← View site</a>
    </div>
  </aside>

  <div class="panel-main">
    <header class="panel-topbar">
      <h1>{% block page_title %}Admin Panel{% endblock %}</h1>
      <div class="panel-user">
        <span>Signed in as <strong>{{ user.name|default:user.email }}</strong></span>
        <a class="panel-logout" href="{% url 'logout' %}">Logout</a>
      </div>
    </header>

    <main class="panel-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
