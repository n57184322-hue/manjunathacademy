<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin Panel{% endblock %} — Manjunath Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F97316;
  --orange-deep:#EA580C;
  --orange-soft:#FFF1E6;
  --peach:#FCEBE0;
  --cream:#FFF7F1;
  --ink:#101012;
  --muted:#6B7280;
  --line:rgba(16,16,18,.09);
  --white:#fff;
  --shadow-sm:0 2px 10px rgba(16,16,18,.06);
  --shadow-md:0 14px 34px rgba(120,60,20,.10);
  --shadow-lg:0 24px 56px rgba(16,16,18,.14);
  --r-pill:999px;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:#F3EEE8;line-height:1.5;
}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;margin:0;letter-spacing:-.01em}

.panel-shell{display:flex;min-height:100vh}

.panel-sidebar{
  width:252px;flex:0 0 auto;color:#E7E3DF;
  background:radial-gradient(140% 100% at 0% 0%,#201a2e 0%,#141019 55%,#0c0a10 100%);
  display:flex;flex-direction:column;padding:24px 16px;position:relative;
}
.panel-brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:20px}
.panel-crest{width:36px;height:36px;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(212,167,60,.35))}
.panel-brand-text{font-family:"Archivo",sans-serif;font-weight:800;font-size:14px;line-height:1.2;letter-spacing:.02em}
.panel-brand-text span{display:block}
.panel-brand-text span:last-child{color:var(--orange);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}

.panel-nav-label{
  font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:#726C81;padding:0 14px;margin-bottom:8px;
}
.panel-nav{display:flex;flex-direction:column;gap:3px}
.panel-nav a{
  padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;color:#C9C5C0;
  display:flex;align-items:center;gap:11px;transition:.15s ease;position:relative;
}
.panel-nav a .panel-nav-ico{
  width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.06);
  display:grid;place-items:center;font-size:14px;flex:0 0 auto;transition:.15s ease;
}
.panel-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.panel-nav a.is-active{background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;box-shadow:0 8px 18px rgba(249,115,22,.35)}
.panel-nav a.is-active .panel-nav-ico{background:rgba(255,255,255,.2)}

.panel-sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.panel-view-site{font-size:13px;font-weight:600;color:#C9C5C0;padding:10px 14px;display:flex;align-items:center;gap:8px;border-radius:10px}
.panel-view-site:hover{background:rgba(255,255,255,.06);color:#fff}

.panel-main{flex:1;min-width:0;display:flex;flex-direction:column}
.panel-topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 32px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;
}
.panel-topbar h1{font-size:20px;font-weight:800}
.panel-topbar-sub{margin:2px 0 0;font-size:13px;color:var(--muted)}
.panel-user{display:flex;align-items:center;gap:14px}
.panel-user-avatar{
  width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--orange),var(--orange-deep));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:0 0 auto;
}
.panel-user-info{display:flex;flex-direction:column;line-height:1.25}
.panel-user-info strong{font-size:13.5px}
.panel-user-info span{font-size:12px;color:var(--muted)}
.panel-logout{
  background:var(--orange-soft);color:var(--orange-deep);font-weight:700;font-size:13px;
  padding:9px 18px;border-radius:var(--r-pill);transition:.15s ease;
}
.panel-logout:hover{background:var(--orange);color:#fff}

.panel-content{padding:30px 32px 40px;flex:1}

.panel-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:24px}
.panel-stat{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;
}
.panel-stat-ico{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:0 0 auto;
}
.panel-stat-1 .panel-stat-ico{background:var(--orange-soft);color:var(--orange-deep)}
.panel-stat-2 .panel-stat-ico{background:#E8F0FE;color:#2563EB}
.panel-stat-3 .panel-stat-ico{background:#E9F9EF;color:#16A34A}
.panel-stat-4 .panel-stat-ico{background:#F0EBFE;color:#6D3BEB}
.panel-stat-num{font-family:"Archivo",sans-serif;font-size:22px;font-weight:800;line-height:1.1}
.panel-stat-label{font-size:12.5px;color:var(--muted);margin-top:2px}

.panel-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-md);padding:26px}
.panel-card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.panel-card-head h2{font-size:18px;font-weight:800}
.panel-card-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:"Inter",sans-serif;font-weight:700;font-size:14px;
  padding:11px 20px;border-radius:var(--r-pill);border:1.5px solid transparent;
  cursor:pointer;transition:.18s ease;white-space:nowrap;
}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 8px 18px rgba(249,115,22,.28)}
.btn-primary:hover{background:var(--orange-deep);transform:translateY(-1px);box-shadow:0 12px 22px rgba(249,115,22,.34)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:rgba(249,115,22,.5)}

.panel-table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table.panel-table{width:100%;border-collapse:collapse;font-size:13.5px}
table.panel-table th{
  text-align:left;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:12px 14px;background:#FAFAF9;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.panel-table td{padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;color:#374151}
table.panel-table tr:last-child td{border-bottom:0}
table.panel-table tbody tr{transition:background .12s ease}
table.panel-table tbody tr:hover{background:#FFF8F2}
.panel-user-cell{display:flex;align-items:center;gap:10px}
.panel-row-avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff;flex:0 0 auto;
}
.panel-row-name{font-weight:700;color:var(--ink)}
.panel-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 11px;border-radius:var(--r-pill);
  background:var(--orange-soft);color:var(--orange-deep);text-transform:uppercase;letter-spacing:.04em;
}
.panel-badge-muted{background:#F3F4F6;color:#4B5563}
.panel-empty{padding:56px 0;text-align:center;color:var(--muted);font-size:14.5px}
.panel-empty-ico{font-size:34px;display:block;margin-bottom:10px}

.panel-form{display:flex;flex-direction:column;gap:16px;max-width:640px}
.panel-form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel-form label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:#374151}
.panel-label-text{display:inline-flex;align-items:center;gap:4px}
.req{color:#DC2626;font-weight:800}
.panel-form label:has(.panel-errors) input{border-color:#DC2626}
.panel-form input,.panel-form select{
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-size:14px;font-family:inherit;color:var(--ink);
}
.panel-form input:focus,.panel-form select:focus{outline:2px solid var(--orange);outline-offset:1px}
.panel-errors{color:#DC2626;font-size:12.5px;margin:2px 0 0;padding:0;list-style:none}
.panel-form-actions{display:flex;gap:12px;margin-top:4px}

.panel-alert{
  background:#ECFDF3;color:#15803D;border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:700;
  margin-bottom:18px;
}

@media (max-width:1080px){
  .panel-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .panel-shell{flex-direction:column}
  .panel-sidebar{width:100%;flex-direction:row;align-items:center;padding:14px 16px;overflow-x:auto}
  .panel-brand{border-bottom:0;margin-bottom:0;padding:0 14px 0 0;border-right:1px solid rgba(255,255,255,.08)}
  .panel-nav-label{display:none}
  .panel-nav{flex-direction:row;margin-left:14px}
  .panel-sidebar-footer{margin-top:0;margin-left:auto;padding-top:0;border-top:0}
  .panel-content{padding:18px}
  .panel-form-row{grid-template-columns:1fr}
  .panel-user-info{display:none}
}
@media (max-width:560px){
  .panel-stats{grid-template-columns:1fr}
}
{% block extra_style %}{% endblock %}
</style>
</head>
<body>
<div class="panel-shell">
  <aside class="panel-sidebar">
    <div class="panel-brand">
      <span class="panel-crest" aria-hidden="true">
        <svg viewBox="0 0 100 100" role="img">
          <defs>
            <linearGradient id="pgold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#F7DE9A"/>
              <stop offset=".5" stop-color="#D4A73C"/>
              <stop offset="1" stop-color="#9C6B14"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="url(#pgold)"/>
          <circle cx="50" cy="50" r="41" fill="#141019"/>
          <circle cx="50" cy="50" r="38" fill="none" stroke="url(#pgold)" stroke-width="1.5"/>
          <path d="M50 40 C40 28 26 26 16 32 c10 1 15 6 18 11 -7-2-12-1-16 2 8 1 13 4 17 9 6 7 11 10 15 11z" fill="url(#pgold)"/>
          <path d="M50 40 C60 28 74 26 84 32 c-10 1-15 6-18 11 7-2 12-1 16 2-8 1-13 4-17 9-6 7-11 10-15 11z" fill="url(#pgold)"/>
          <path d="M50 30 c4 0 7 3 7 7 0 3-2 5-4 6l6 3-9 2 3 24-3 4-3-4 3-24-9-2 6-3c-2-1-4-3-4-6 0-4 3-7 7-7z" fill="url(#pgold)"/>
          <path d="M28 72 c8-4 15-4 22-1 7-3 14-3 22 1-8 5-15 5-22 2-7 3-14 3-22-2z" fill="url(#pgold)"/>
        </svg>
      </span>
      <span class="panel-brand-text"><span>MANJUNATH</span><span>Admin Panel</span></span>
    </div>

    <p class="panel-nav-label">Main</p>
    <nav class="panel-nav">
      <a class="{% block nav_signups %}{% endblock %}" href="{% url 'panel_signups' %}">
        <span class="panel-nav-ico">👥</span> Signups
      </a>
    </nav>

    <div class="panel-sidebar-footer">
      <a class="panel-view-site" href="{% url 'index' %}"><span class="panel-nav-ico">🌐</span> View site</a>
    </div>
  </aside>

  <div class="panel-main">
    <header class="panel-topbar">
      <div>
        <h1>{% block page_title %}Admin Panel{% endblock %}</h1>
        <p class="panel-topbar-sub">{% block page_sub %}{% endblock %}</p>
      </div>
      <div class="panel-user">
        <span class="panel-user-avatar">{{ user.name|default:user.email|first|upper }}</span>
        <span class="panel-user-info">
          <strong>{{ user.name|default:user.email }}</strong>
          <span>Administrator</span>
        </span>
        <a class="panel-logout" href="{% url 'logout' %}">Logout</a>
      </div>
    </header>

    <main class="panel-content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
